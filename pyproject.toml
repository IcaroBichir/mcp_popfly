[project]
name = "popfly-mcp"
version = "0.1.0"
description = "MCP server for Popfly — browse and filter creator campaigns in Claude"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["mcp", "popfly", "claude", "ugc", "creator", "campaigns"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "click>=8.1.0",
]

[project.scripts]
popfly-mcp = "popfly_mcp.__main__:cli"

[project.urls]
Homepage = "https://github.com/IcaroBichir/mcp_popfly"
Issues = "https://github.com/IcaroBichir/mcp_popfly/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["popfly_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
